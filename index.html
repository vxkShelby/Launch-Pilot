<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaunchPilot</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="topbar">
      <div class="brand">
        <h1>LaunchPilot</h1>
        <span class="version muted">v0.6.2</span>
      </div>
      <div id="stats" class="stats muted"></div>
      <div class="controls">
        <input id="search" type="search" placeholder="Filter games…" />
        <button id="update-all-btn" hidden>Update all</button>
        <button id="refresh-btn" class="icon-btn" title="Refresh now">&#8635;</button>
        <button id="settings-btn" class="icon-btn" title="Settings">&#9881;</button>
      </div>
    </header>

    <main class="container">
      <p id="update-status" class="muted"></p>
      <div id="game-list" class="muted">Loading games&hellip;</div>
    </main>

    <div id="settings-panel" class="settings-panel" hidden>
      <div class="settings-card">
        <h2>Settings</h2>
        <label class="settings-row">
          Auto-refresh every
          <select id="interval-select">
            <option value="0">Off</option>
            <option value="15">15 minutes</option>
            <option value="30" selected>30 minutes</option>
            <option value="60">60 minutes</option>
          </select>
        </label>
        <button id="settings-close">Close</button>
      </div>
    </div>

    <footer class="statusbar">
      <span id="last-checked" class="muted"></span>
    </footer>
  </body>
</html>
